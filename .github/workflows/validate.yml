name: Validate research bundles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate every versioned bundle
        run: python scripts/validate_bundle.py --all
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate exact published bytes and immutable history
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_release_ci.py
